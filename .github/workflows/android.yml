name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/AgentTask.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AgentTask-apk
          path: out/AgentTask.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Agent Task (latest)
          files: out/AgentTask.apk
          
